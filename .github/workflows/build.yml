name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: if [ -f cookx-project.zip ]; then unzip -oq cookx-project.zip; fi
      - name: Usar mi icono PNG
        run: |
          ICON=$(ls *.png 2>/dev/null | head -n 1)
          if [ -n "$ICON" ]; then
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            cp "$ICON" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/drawable/ic_launcher_foreground.xml
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CookX-APK
          path: app/build/outputs/apk/debug/*.apk
